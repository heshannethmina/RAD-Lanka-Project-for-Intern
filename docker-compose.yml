# Judge0 only.
#
# The Go backend and the Next.js app are run directly (`go run ./cmd/server`,
# `npm run dev`) rather than as services here: Judge0 is deliberately a
# separate service so that a sandbox escape cannot reach the application
# process, and keeping it in its own compose file makes that boundary obvious.
#
# Judge0 brings its own Postgres and Redis. They are its private storage and
# are unrelated to the application database that steps 5-6 will add.

name: interview-platform-judge0

services:
  judge0:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      - db
      - redis

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: postgres:13.0
    env_file: judge0.conf
    volumes:
      - judge0-postgres:/var/lib/postgresql/data/
    restart: unless-stopped

  redis:
    image: redis:6.0
    command:
      [
        "bash",
        "-c",
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: judge0.conf
    volumes:
      - judge0-redis:/data
    restart: unless-stopped

volumes:
  judge0-postgres:
  judge0-redis:
