# Judge0 configuration. Local development only — these credentials are not
# secret and this file is committed on purpose so `docker compose up` works
# from a clean checkout. Generate real ones before this is exposed anywhere.

################################################################################
# Judge0 Server
################################################################################
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pg

################################################################################
# Judge0 Workers
################################################################################
COUNT=2

################################################################################
# Submission limits
#
# The Go proxy sets per-submission limits too; these are the outer ceiling
# that a client cannot talk its way past.
################################################################################
MAX_QUEUE_SIZE=100
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=10
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=256000
MAX_PROCESSES_AND_OR_THREADS=60

# No network inside the sandbox: submitted code must not be able to call out.
ENABLE_NETWORK=false
